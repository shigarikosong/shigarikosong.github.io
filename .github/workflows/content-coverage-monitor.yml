name: Check content coverage

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
  schedule:
    # Sunday 10:23 JST. Avoid the start of the hour, when scheduled jobs are busier.
    - cron: "23 1 * * 0"

permissions:
  contents: read
  issues: write

concurrency:
  group: content-coverage-monitor
  cancel-in-progress: false

jobs:
  audit-content-coverage:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        contains(github.event.issue.labels.*.name, 'content-coverage-monitor') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        ) &&
        (
          startsWith(github.event.comment.body, '/ignore') ||
          startsWith(github.event.comment.body, '/unignore')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate monitoring command
        if: github.event_name == 'issue_comment'
        id: command
        env:
          COMMAND_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          printf '%s\n' "$COMMAND_BODY" > content-coverage-command.txt
          node scripts/content-coverage-command.mjs content-coverage-command.txt \
            > content-coverage-command.json

          {
            echo "valid=$(jq -r '.valid' content-coverage-command.json)"
            echo "action=$(jq -r '.action // ""' content-coverage-command.json)"
            echo "key=$(jq -r '.key // ""' content-coverage-command.json)"
            echo "error=$(jq -r '.error // ""' content-coverage-command.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish invalid command feedback
        if: github.event_name == 'issue_comment' && steps.command.outputs.valid != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMAND_ERROR: ${{ steps.command.outputs.error }}
        run: |
          printf '%s\n' \
            '**監視コマンドを受け付けられませんでした。**' \
            '' \
            "理由: $COMMAND_ERROR" \
            '' \
            '対象外: `/ignore youtube:VIDEO_ID 理由（省略可）`' \
            '取消: `/unignore youtube:VIDEO_ID`' \
            > content-coverage-command-feedback.md

          gh issue comment "$ISSUE_NUMBER" \
            --body-file content-coverage-command-feedback.md

      - name: Prepare monitoring issue
        if: github.event_name != 'issue_comment' || steps.command.outputs.valid == 'true'
        id: monitoring-issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_LABEL: content-coverage-monitor
          ISSUE_TITLE: 動画収録確認（自動監視）
        run: |
          set -euo pipefail

          gh label create "$ISSUE_LABEL" \
            --color "6b7280" \
            --description "Wikiとの動画収録状況を定期確認する自動Issue" \
            --force

          issue_number="$({
            gh issue list \
              --label "$ISSUE_LABEL" \
              --state all \
              --limit 100 \
              --json number,title \
              --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number"
          } | head -n 1)"

          if [ -z "$issue_number" ]; then
            printf '%s\n' \
              '# 動画収録確認（自動監視）' \
              '' \
              '毎週、司賀りこWikiとサイトの動画データを照合し、このIssueへ結果を追記します。' \
              '' \
              '- 候補がない場合も実行完了を記録します。' \
              '- 候補は自動でサイトへ追加されません。' \
              '- 対象外にする場合は、結果に表示された `/ignore platform:ID` をコメントしてください。' \
              '- 対象外指定の取り消しは `/unignore platform:ID` です。' \
              '- Wiki取得や解析に失敗した場合も、このIssueへ失敗を記録します。' \
              '' \
              'GitHub通知を受け取るには、このIssueをSubscribeしてください。' \
              > content-coverage-issue-body.md

            issue_url="$(gh issue create \
              --title "$ISSUE_TITLE" \
              --label "$ISSUE_LABEL" \
              --body-file content-coverage-issue-body.md)"
            issue_number="${issue_url##*/}"
          else
            issue_state="$(gh issue view "$issue_number" --json state --jq '.state')"
            if [ "$issue_state" = "CLOSED" ]; then
              gh issue reopen "$issue_number"
            fi
          fi

          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$issue_number/comments?per_page=100" \
            --jq '.[].body' \
            > content-coverage-reported.txt

          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$issue_number/comments?per_page=100" \
            --jq '.[] | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR") | .body' \
            > content-coverage-decisions.txt

      - name: Audit content coverage
        if: github.event_name != 'issue_comment' || steps.command.outputs.valid == 'true'
        id: audit
        continue-on-error: true
        run: |
          set -o pipefail

          node scripts/content-coverage-audit.mjs \
            --reported-file content-coverage-reported.txt \
            --decisions-file content-coverage-decisions.txt \
            --json-output content-coverage-result.json \
            --markdown-output content-coverage-report.md \
            2>&1 | tee content-coverage-audit.log

      - name: Prepare failure report
        if: steps.audit.outcome == 'failure'
        run: |
          checked_at="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"

          printf '%s\n' \
            "## $checked_at JST" \
            '' \
            '**動画収録状況の確認に失敗しました。**' \
            '' \
            '候補なしとは判定していません。Wikiの取得失敗またはHTML構造の変更が考えられます。' \
            '' \
            '<details><summary>エラー概要</summary>' \
            '' \
            '```text' \
            > content-coverage-report.md

          tail -n 20 content-coverage-audit.log >> content-coverage-report.md

          printf '%s\n' \
            '```' \
            '' \
            '</details>' \
            >> content-coverage-report.md

      - name: Add command acknowledgment
        if: always() && github.event_name == 'issue_comment' && steps.command.outputs.valid == 'true'
        env:
          COMMAND_ACTION: ${{ steps.command.outputs.action }}
          COMMAND_KEY: ${{ steps.command.outputs.key }}
        run: |
          {
            printf '✅ `/%s %s` を受け付けました。\n\n' \
              "$COMMAND_ACTION" "$COMMAND_KEY"
            cat content-coverage-report.md
          } > content-coverage-command-result.md

          mv content-coverage-command-result.md content-coverage-report.md

      - name: Publish monitoring result
        if: always() && steps.monitoring-issue.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.monitoring-issue.outputs.issue_number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file content-coverage-report.md

      - name: Mark failed audit
        if: steps.audit.outcome == 'failure'
        run: exit 1
